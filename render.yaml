services:
  - type: web
    name: matabeira-menu
    runtime: static
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
